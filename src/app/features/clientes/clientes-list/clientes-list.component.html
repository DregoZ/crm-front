<div class="list-container">
  <div class="header-actions">
    <h2>Clientes</h2>
    <a routerLink="nuevo" class="btn btn-primary"
      ><mat-icon class="icon">person_add</mat-icon> Nuevo Cliente</a
    >
  </div>

  <div *ngIf="loading()" class="loading">Cargando...</div>

  <app-data-table
    [columns]="columns"
    [data]="clientes()"
    [actions]="actions"
    [loading]="loading()"
    [sortActive]="state$.value.sort.active"
    [sortDirection]="state$.value.sort.direction"
    (sortChange)="onSortChange($event)"
    emptyMessage="No hay clientes registrados."
  >
  </app-data-table>

  <div class="pagination" *ngIf="totalPages() > 1">
    <button
      [disabled]="(page$ | async) === 1"
      (click)="changePage(page$.value - 1)"
    >
      Anterior
    </button>
    <span>Página {{ (state$ | async)?.page }} de {{ totalPages() }}</span>
    <button
      [disabled]="(state$ | async)?.page === 1"
      (click)="changePage(state$.value.page - 1)"
    >
      Anterior
    </button>
    <button
      [disabled]="(state$ | async)?.page === totalPages()"
      (click)="changePage(state$.value.page + 1)"
    >
      Siguiente
    </button>
  </div>
</div>
