<div class="login-container">
  <div class="login-card">
    <h2>CRM Coctelería</h2>
    <p>Inicia sesión para continuar</p>

    <div *ngIf="errorMsg()" class="alert alert-error">
      {{ errorMsg() }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          #emailCtrl="ngModel"
          class="form-control"
          placeholder="admin@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          class="form-control"
          placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="loading() || !loginForm.form.valid" class="btn btn-primary w-100">
        {{ loading() ? 'Iniciando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
