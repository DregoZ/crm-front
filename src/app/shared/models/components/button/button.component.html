<!-- =========================================================================
     EJEMPLOS PARA AÑADIR UN BOTÓN (<app-button>)
     variants: primary | secondary | info | warning | danger | success
     Añade -outlined para el estilo outline: 'primary-outlined', etc.
     ========================================================================= -->

<!-- === LINK (navegación con routerLink) === -->
@if (routerLink()) {
  @if (isOutlined()) {
    <a mat-stroked-button
       [routerLink]="disabled() ? null : routerLink()"
       [color]="matColor()"
       [class.mat-success]="isSuccess()"
       [class.mat-small]="size() === 'sm'"
       [class.disabled]="disabled()"
       [attr.title]="effectiveTitle">
      <mat-icon *ngIf="icon()">{{ icon() }}</mat-icon>
      <span *ngIf="label()">{{ label() }}</span>
    </a>
  } @else {
    <a mat-flat-button
       [routerLink]="disabled() ? null : routerLink()"
       [color]="matColor()"
       [class.mat-success]="isSuccess()"
       [class.mat-small]="size() === 'sm'"
       [class.disabled]="disabled()"
       [attr.title]="effectiveTitle">
      <mat-icon *ngIf="icon()">{{ icon() }}</mat-icon>
      <span *ngIf="label()">{{ label() }}</span>
    </a>
  }
} @else {
  <!-- === BUTTON (emite evento) === -->
  @if (isOutlined()) {
    <button mat-stroked-button
            [color]="matColor()"
            [class.mat-success]="isSuccess()"
            [class.mat-small]="size() === 'sm'"
            [disabled]="disabled()"
            [attr.title]="effectiveTitle"
            (click)="onClick()">
      <mat-icon *ngIf="icon()">{{ icon() }}</mat-icon>
      <span *ngIf="label()">{{ label() }}</span>
    </button>
  } @else {
    <button mat-flat-button
            [color]="matColor()"
            [class.mat-success]="isSuccess()"
            [class.mat-small]="size() === 'sm'"
            [disabled]="disabled()"
            [attr.title]="effectiveTitle"
            (click)="onClick()">
      <mat-icon *ngIf="icon()">{{ icon() }}</mat-icon>
      <span *ngIf="label()">{{ label() }}</span>
    </button>
  }
}
