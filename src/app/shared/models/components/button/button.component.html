<a
  *ngIf="routerLink() as link; else buttonMode"
  [routerLink]="disabled() ? null : link"
  [class]="cssClasses"
  [class.disabled]="disabled()"
  [attr.title]="effectiveTitle"
>
  <mat-icon *ngIf="icon()" class="icon">{{ icon() }}</mat-icon>
  <span *ngIf="label()">{{ label() }}</span>
</a>

<ng-template #buttonMode>
  <button
    type="button"
    [class]="cssClasses"
    [disabled]="disabled()"
    [attr.title]="effectiveTitle"
    (click)="onClick()"
  >
    <mat-icon *ngIf="icon()" class="icon">{{ icon() }}</mat-icon>
    <span *ngIf="label()">{{ label() }}</span>
  </button>
</ng-template>
