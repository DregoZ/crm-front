<!-- data-table.component.html -->
<div class="table-scroll-wrapper">
  <table
    mat-table
    [dataSource]="data()"
    matSort
    [matSortActive]="sortActive()"
    [matSortDirection]="sortDirection()"
    (matSortChange)="onSortChange($event)"
    class="data-table"
  >
    <ng-container *ngFor="let column of columns()" [matColumnDef]="column.name">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        [disabled]="column.sortable === false"
        [style.width.%]="column.size"
      >
        {{ column.label }}
      </th>
      <td mat-cell *matCellDef="let row" [style.width.%]="column.size">
        <ng-container [ngSwitch]="column.type">
          <span *ngSwitchCase="'date'">{{
            getCellValue(row, column) | date: column.format || "shortDate"
          }}</span>
          <span *ngSwitchCase="'currency'">{{
            getCellValue(row, column) | currency: "EUR"
          }}</span>
          <span *ngSwitchCase="'boolean'">{{
            getCellValue(row, column) ? "Sí" : "No"
          }}</span>
          <span *ngSwitchDefault>{{ getCellValue(row, column) ?? "-" }}</span>
        </ng-container>
      </td>
    </ng-container>

    <ng-container matColumnDef="__actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <ng-container *ngFor="let action of actions()">
          <button
            mat-icon-button
            *ngIf="!action.visible || action.visible(row)"
            [class]="action.cssClass"
            [attr.title]="action.label"
            (click)="action.handler(row); $event.stopPropagation()"
          >
            <mat-icon *ngIf="action.icon">{{ action.icon }}</mat-icon>
            <span *ngIf="!action.icon">{{ action.label }}</span>
          </button>
        </ng-container>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns()"
      [class.clickable]="rowClickable()"
      (click)="onRowClick(row)"
    ></tr>
  </table>

  <div class="empty-state" *ngIf="!loading() && data().length === 0">
    {{ emptyMessage() }}
  </div>
  <div class="loading-state" *ngIf="loading()">Cargando...</div>
</div>
